

services:
  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: industry-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - industry-network
    restart: unless-stopped
    healthcheck:
      test: echo ruok | nc localhost 2181
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: industry-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    networks:
      - industry-network
    restart: unless-stopped
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server kafka:29092
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Topics Initializer
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: industry-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        echo 'Creating Kafka topics...'
        kafka-topics --bootstrap-server kafka:29092 --create --topic raw-material-produced --partitions 1 --replication-factor 1 --if-not-exists
        kafka-topics --bootstrap-server kafka:29092 --create --topic processing-completed --partitions 1 --replication-factor 1 --if-not-exists
        kafka-topics --bootstrap-server kafka:29092 --create --topic component-assembled --partitions 1 --replication-factor 1 --if-not-exists
        kafka-topics --bootstrap-server kafka:29092 --create --topic product-assembled --partitions 1 --replication-factor 1 --if-not-exists
        kafka-topics --bootstrap-server kafka:29092 --create --topic inventory-updated --partitions 1 --replication-factor 1 --if-not-exists
        echo 'Kafka topics created successfully!'
    networks:
      - industry-network
    restart: on-failure

  # ==========================================================================
  # Servidor de Base de Dados ÚNICO e global do projecto.
  # Cada microserviço tem a sua própria base de dados isolada DENTRO deste
  # mesmo servidor (raw_material_db, processing_db, component_db,
  # assembly_db) - nenhum serviço acede à base de dados de outro.
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: industry-postgres
    environment:
      POSTGRES_USER: industry_user
      POSTGRES_PASSWORD: industry_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-init/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - industry-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industry_user"]
      interval: 10s
      timeout: 5s
      retries: 5

# ==============================================================================
# NOTA DE ARQUITECTURA: os microserviços (raw-material, processing, component
# e assembly) NÃO correm em contentores. O enunciado restringe explicitamente
# o uso de Docker/Podman à execução do Kafka e do servidor de Base de Dados de
# suporte. Os microserviços devem ser compilados e executados nativamente no
# ambiente local (ver quickstart.sh: mvn spring-boot:run / java -jar).
# ==============================================================================

volumes:
  postgres_data:

networks:
  industry-network:
    driver: bridge
